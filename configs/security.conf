# Security configuration for enterprise-devops-platform (Pari Singhal)
[authentication]
mfa_required        = true
session_timeout_min = 20
password_min_length = 16
password_rotation_days = 60

[authorization]
default_role        = read-only
admin_group         = operations
developer_group     = developers
allow_root_login    = false

[secrets]
provider            = github-actions-secrets
encryption          = aes-256-gcm
rotate_every_days   = 45

[network]
allowed_ingress_cidr   = 10.10.0.0/16,172.20.0.0/16
deny_egress_to_public  = true
require_tls_min        = 1.3

[containers]
allow_privileged     = false
allow_root_user      = false
require_image_tag    = true
banned_tags          = latest,dev,test,nightly,snapshot
require_resource_limits = true

[audit]
log_path             = /var/log/enterprise-devops/audit.log
retention_days       = 730
forward_to_siem      = true
