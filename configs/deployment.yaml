apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-payments-service
  namespace: prod-east
  labels:
    app: enterprise-payments-service
    tier: backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: enterprise-payments-service
  template:
    metadata:
      labels:
        app: enterprise-payments-service
    spec:
      containers:
        - name: payments
          image: registry.enterprise.local/payments-service:2.3.1
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 2001
            allowPrivilegeEscalation: false
